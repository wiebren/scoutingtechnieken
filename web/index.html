<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Scoutingtechnieken</title>
  <meta name="description" content="Scoutingtechnieken opzoeken en leren: knopen en sjorringen, kaart en kompas, tochttechnieken, seinen, vuur, kamperen, natuur en meer. Werkt ook zonder internet.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#18201b" media="(prefers-color-scheme: dark)">
  <!-- the theme chosen in Instellingen (src/opslag.js), set before the first paint -->
  <script>try { const t = JSON.parse(localStorage.getItem('scoutingtechnieken.thema.v1')); if (t === 'licht' || t === 'donker') document.documentElement.dataset.theme = t === 'donker' ? 'dark' : 'light'; } catch { /* auto */ }</script>
  <script>try { const g = { klein: '87.5%', groot: '115%', groter: '130%' }[JSON.parse(localStorage.getItem('scoutingtechnieken.tekst.v1'))]; if (g) document.documentElement.style.fontSize = g; } catch { /* normaal */ }</script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Technieken">
</head>
<body>
  <!-- One page; src/main.js builds the app in #app and keeps where you are after the # (src/router.js). -->
  <div id="app"></div>
  <noscript>Deze app heeft JavaScript nodig.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
