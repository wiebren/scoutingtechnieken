name: Pages

# Builds the site, as a check: the homepage and the handleiding (web/site/) at the root, the app (web/dist/) in app/
# (web/scripts/pages.mjs). It is published at scoutvaardig.nl/scoutingtechnieken/ by wiebren/scoutvaardig, which
# builds the commit this workflow last passed. Here, at wiebren.github.io/scoutingtechnieken/, GitHub Pages only
# sends every address on to the same page there (.github/doorsturen.html).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a run already going is left to finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # pnpm check (data and tests), the app, and the pages around it: whether this commit can go to scoutvaardig.nl
      - run: pnpm build:pages

      - name: Doorsturen
        working-directory: .
        run: mkdir _site && cp .github/doorsturen.html _site/index.html && cp .github/doorsturen.html _site/404.html

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
